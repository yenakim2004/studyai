name: 기능 제안
description: StudyAI의 개선 방향을 제안합니다.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        먼저 어떤 학습 작업이 불편한지 알려 주세요. [기여 안내](https://github.com/yenakim2004/studyai/blob/main/CONTRIBUTING.md)를 참고하세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어렵거나 할 수 없는 학습 작업을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 기능과 동작
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
  - type: checkboxes
    id: scope
    attributes:
      label: 개인정보 보호
      options:
        - label: 사용자가 전송 내용을 확인하고 동의하지 않는 한 강의와 학습 자료를 기기에 보관합니다.
          required: true
