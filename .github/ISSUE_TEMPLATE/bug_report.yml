name: 오류 제보
description: StudyAI가 안내된 대로 작동하지 않습니다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 공개 이슈 대신 [보안 안내](https://github.com/yenakim2004/studyai/blob/main/SECURITY.md)를 따라 주세요.
        실제 강의 자료, 학습 내보내기 파일, 인증 정보나 개인정보는 첨부하지 마세요. 직접 만든 예제 파일로 재현해 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 문제가 발생한 기능
      options:
        - 학습 화면·검색·암기 카드·시험
        - PowerPoint·PDF 가져오기
        - ChatGPT 연결·AI 학습 도우미
        - 학습 팩·명령줄 도구
        - 백업·복원
        - 문서
        - 기타
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 어떤 문제가 발생했나요?
      description: 실행한 작업과 실제 결과를 적고 오류 문구를 그대로 포함해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 개인 자료 없이 문제를 재현하는 최소 단계를 적어 주세요.
      placeholder: |
        1. 과목을 만듭니다.
        2. 예제 파일을 가져옵니다.
        3. 문제가 발생한 화면을 엽니다.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 실행 중인 커밋
      description: git rev-parse --short HEAD의 결과를 적어 주세요.
  - type: input
    id: environment
    attributes:
      label: 브라우저·운영체제·Node.js·pnpm 버전
  - type: checkboxes
    id: confirm
    attributes:
      label: 제출 전 확인
      options:
        - label: 보안 취약점 제보가 아닙니다.
          required: true
        - label: 실제 강의 자료, 인증 정보와 개인정보를 포함하지 않았습니다.
          required: true
